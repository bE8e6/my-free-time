<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>我的空闲时间</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --ink:#1f2430; --muted:#8a93a6;
    --line:#e7eaf0; --free:#2f9e63; --free-bg:#cdeedb; --free-bd:#8fd3ad;
    --brand:#3b6ef6; --brand-bg:#eef3ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  .wrap{max-width:920px;margin:0 auto;padding:26px 16px 56px}
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:21px;margin:0;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
        box-shadow:0 6px 24px rgba(28,38,66,.05)}
  .toolbar{display:flex;align-items:center;gap:8px}
  .toolbar button{border:1px solid var(--line);background:#fff;border-radius:10px;height:38px;
        min-width:38px;padding:0 10px;font-size:16px;cursor:pointer;color:var(--ink)}
  .toolbar button:hover{border-color:var(--brand);color:var(--brand)}
  .range{font-size:15px;font-weight:600;text-align:center;min-width:190px}

  /* 桌面：整周网格 */
  .tt-scroll{overflow-x:auto;margin-top:6px}
  .tt{display:grid;grid-template-columns:52px repeat(7,1fr);gap:4px;min-width:660px}
  .wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0 8px;border-bottom:1px solid var(--line)}
  .wd b{display:block;font-size:15px;color:var(--ink);margin-top:3px;font-weight:600}
  .wd.today b,.wd.today{color:var(--brand)}
  .time{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;height:30px}
  .slot{height:30px;border-radius:7px;background:#f0f2f7;border:1px solid #eaecf2}
  .slot.free{background:var(--free-bg);border-color:var(--free-bd)}

  /* 移动端：一天一屏 */
  .mobile{display:none}
  .daybar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
  .daytab{flex:1 0 auto;min-width:44px;border:1px solid var(--line);background:#fff;border-radius:10px;
          padding:7px 4px;text-align:center;font-size:11px;color:var(--muted);cursor:pointer;line-height:1.25}
  .daytab b{display:block;font-size:16px;color:var(--ink);margin-top:2px;font-weight:600}
  .daytab .fdot{display:block;width:6px;height:6px;border-radius:50%;background:transparent;margin:4px auto 0}
  .daytab .fdot.on{background:var(--free)}
  .daytab.today b{color:var(--brand)}
  .daytab.sel{border-color:var(--brand);background:var(--brand-bg)}
  .daytab.sel b{color:var(--brand)}
  .mhead{font-size:13px;color:var(--muted);margin:4px 2px 2px}
  .hourlist{display:flex;flex-direction:column;gap:7px;margin-top:10px}
  .hrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .hrow.free{border-color:var(--free-bd);background:#f4fbf7}
  .hlbl{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
  .pill{margin-left:auto;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;background:#f0f2f7;color:var(--muted)}
  .pill.free{background:var(--free-bg);color:var(--free)}

  .legend{display:flex;gap:18px;align-items:center;margin-top:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .legend .dot{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:6px;vertical-align:-2px}
  .dot.on{background:var(--free-bg);border:1px solid var(--free-bd)}
  .dot.off{background:#f0f2f7;border:1px solid #eaecf2}
  .foot{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}

  @media (max-width:700px){
    .desktop-wrap{display:none}
    .mobile{display:block}
    .wrap{padding:18px 12px calc(48px + env(safe-area-inset-bottom))}
    .range{min-width:0;font-size:14px}
    header{gap:10px}
    .toolbar{width:100%;justify-content:space-between}
    .toolbar .range{flex:1}
    .card{padding:12px;border-radius:14px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>我的空闲时间</h1>
    </div>
    <div class="toolbar">
      <button id="prev" title="上一周">‹</button>
      <div class="range" id="rangeLabel">—</div>
      <button id="next" title="下一周">›</button>
      <button id="today" title="回到本周">今天</button>
    </div>
  </header>

  <div class="card">
    <div class="desktop-wrap"><div class="tt-scroll"><div class="tt" id="grid"></div></div></div>
    <div class="mobile" id="mobile"></div>
    <div class="legend">
      <span><i class="dot on"></i>空闲</span>
      <span><i class="dot off"></i>未标注</span>
    </div>
  </div>
  <div class="foot" id="foot">加载中…</div>
</div>

<script>
const HOURS = []; for(let h=8;h<18;h++) HOURS.push(h);
const WD = ['一','二','三','四','五','六','日'];
let DATA = { free:{}, updated:null };
let cursor = startOfWeek(new Date());
let selIndex = (new Date().getDay()+6)%7;

const pad = n => String(n).padStart(2,'0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function startOfWeek(d){ const x=new Date(d); const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); x.setHours(0,0,0,0); return x; }
function daysOfWeek(){ const s=cursor; return [...Array(7)].map((_,i)=>{ const d=new Date(s); d.setDate(s.getDate()+i); return d; }); }

function render(){
  const days = daysOfWeek();
  const s=days[0], e=days[6], sameMonth=s.getMonth()===e.getMonth();
  document.getElementById('rangeLabel').textContent =
    `${s.getFullYear()}年${s.getMonth()+1}月${s.getDate()}日 – ${sameMonth?'':(e.getMonth()+1)+'月'}${e.getDate()}日`;
  buildDesktop(days);
  buildMobile(days);
  const foot=document.getElementById('foot');
  foot.textContent = DATA.updated ? `最后更新：${new Date(DATA.updated).toLocaleString('zh-CN')}` : '暂无数据';
}

function buildDesktop(days){
  const grid=document.getElementById('grid'); grid.innerHTML='';
  const todayKey=dateKey(new Date());
  grid.appendChild(document.createElement('div'));
  days.forEach(d=>{
    const el=document.createElement('div');
    el.className='wd'+(dateKey(d)===todayKey?' today':'');
    el.innerHTML=`周${WD[(d.getDay()+6)%7]}<b>${d.getDate()}</b>`;
    grid.appendChild(el);
  });
  HOURS.forEach(h=>{
    const t=document.createElement('div'); t.className='time'; t.textContent=`${h}:00`; grid.appendChild(t);
    days.forEach(d=>{
      const key=dateKey(d); const free=DATA.free?.[key]||[];
      const cell=document.createElement('div');
      cell.className='slot'+(free.includes(String(h))?' free':'');
      cell.title=`${key} ${h}:00–${h+1}:00`;
      grid.appendChild(cell);
    });
  });
}

function buildMobile(days){
  const box=document.getElementById('mobile'); box.innerHTML='';
  const todayKey=dateKey(new Date());
  const bar=document.createElement('div'); bar.className='daybar';
  days.forEach((d,i)=>{
    const key=dateKey(d); const free=DATA.free?.[key]||[];
    const b=document.createElement('button');
    b.className='daytab'+(key===todayKey?' today':'')+(i===selIndex?' sel':'');
    b.innerHTML=`周${WD[(d.getDay()+6)%7]}<b>${d.getDate()}</b><i class="fdot${free.length?' on':''}"></i>`;
    b.onclick=()=>{ selIndex=i; render(); };
    bar.appendChild(b);
  });
  box.appendChild(bar);

  const d=days[selIndex], key=dateKey(d), free=DATA.free?.[key]||[];
  const head=document.createElement('div'); head.className='mhead';
  head.textContent=`${d.getMonth()+1}月${d.getDate()}日 周${WD[(d.getDay()+6)%7]}`;
  box.appendChild(head);

  const list=document.createElement('div'); list.className='hourlist';
  HOURS.forEach(h=>{
    const isFree=free.includes(String(h));
    const row=document.createElement('div'); row.className='hrow'+(isFree?' free':'');
    row.innerHTML=`<span class="hlbl">${h}:00 – ${h+1}:00</span>`+
      `<span class="pill${isFree?' free':''}">${isFree?'空闲':'未标注'}</span>`;
    list.appendChild(row);
  });
  box.appendChild(list);
}

async function load(){
  try{ const res=await fetch('data.json?t='+Date.now(),{cache:'no-store'}); if(res.ok) DATA=await res.json(); }catch(e){}
  if(!DATA.free) DATA={free:{},updated:null};
  render();
}

document.getElementById('prev').onclick=()=>{ cursor.setDate(cursor.getDate()-7); render(); };
document.getElementById('next').onclick=()=>{ cursor.setDate(cursor.getDate()+7); render(); };
document.getElementById('today').onclick=()=>{ cursor=startOfWeek(new Date()); selIndex=(new Date().getDay()+6)%7; render(); };
load();
</script>
</body>
</html>
